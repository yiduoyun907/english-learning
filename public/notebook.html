<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>生词本 · 英语学习</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main class="container">
    <h1>生词本</h1>

    <div class="card" style="margin-bottom:16px;">
      <label class="field-label" for="search-input">词典检索</label>
      <input class="input" id="search-input" placeholder="输入英文单词或中文释义" autocomplete="off">
      <div id="search-results" style="margin-top:12px;"></div>
    </div>

    <div class="row-between">
      <h2 style="margin:0;">我的生词</h2>
      <span class="muted small" id="notebook-count"></span>
    </div>

    <div class="card" id="notebook-list" style="margin-top:12px;"></div>
  </main>

  <script type="module" src="/js/notebook.js"></script>
</body>
</html>
