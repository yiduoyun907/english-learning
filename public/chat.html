<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 对话 · 英语学习</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main class="container">
    <h1>AI 对话</h1>
    <p class="muted small">
      选一个场景开始对话。对方会用英文回应，并在每轮之后指出你句子里的错误。
    </p>

    <div class="group-heading" style="margin-top:24px;">
      <strong>选择场景</strong>
    </div>
    <div id="scene-list"></div>

    <div class="group-heading" style="margin-top:28px;">
      <strong>我的会话</strong>
      <span class="muted small">继续之前没聊完的</span>
    </div>
    <div class="card" id="conversation-list"></div>
  </main>

  <script type="module" src="/js/chat.js"></script>
</body>
</html>
