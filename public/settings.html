<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>设置 · 英语学习</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main class="container">
    <h1>设置</h1>

    <div class="card" style="margin-top:20px;">
      <h2>学习偏好</h2>

      <p class="small muted" style="margin-top:0;">
        每日学习量已移到<strong>首页</strong>的「每日学习单词」，在那里直接改。
      </p>

      <label class="field">
        <span class="field-label">复习队列上限（10-500）</span>
        <input class="input" id="review-limit" type="number" min="10" max="500" step="10">
        <span class="small muted">
          每次复习最多考多少个词。已学词少于这个数时全部复习；
          超出时按学习时间加权抽取，越早学的出现得越少。
        </span>
      </label>

      <label class="field">
        <span class="field-label">发音口音</span>
        <select class="input" id="accent">
          <option value="us">美式</option>
          <option value="uk">英式</option>
        </select>
      </label>

      <label class="field">
        <span class="field-label">主题</span>
        <select class="input" id="theme">
          <option value="light">浅色</option>
          <option value="dark">深色</option>
        </select>
      </label>

      <button class="btn btn-primary" id="save-settings" type="button">保存</button>
    </div>

    <div class="card">
      <h2>修改密码</h2>

      <label class="field">
        <span class="field-label">当前密码</span>
        <input class="input" id="current-password" type="password" autocomplete="current-password">
      </label>

      <label class="field">
        <span class="field-label">新密码（至少 6 位）</span>
        <input class="input" id="new-password" type="password" autocomplete="new-password">
      </label>

      <button class="btn" id="change-password" type="button">修改密码</button>
      <p class="small muted" style="margin-bottom:0;">修改后需重新登录</p>
    </div>

    <div class="card">
      <h2>账号</h2>
      <p class="muted small" id="account-line"></p>
      <button class="btn" id="logout" type="button">退出登录</button>
    </div>
  </main>

  <script type="module" src="/js/settings.js"></script>
</body>
</html>
