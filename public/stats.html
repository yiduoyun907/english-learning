<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>统计 · 英语学习</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main class="container">
    <h1>统计</h1>

    <div class="stat-grid" style="margin-top:20px;">
      <div class="stat">
        <div class="stat-value" id="streak">0</div>
        <div class="stat-label">连续打卡（天）</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="learned">0</div>
        <div class="stat-label">累计已学</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="mastered">0</div>
        <div class="stat-label">已掌握</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="notebook">0</div>
        <div class="stat-label">生词本</div>
      </div>
    </div>

    <div class="card" style="margin-top:16px;">
      <h2>今日</h2>
      <p class="muted small" id="today-line" style="margin:0;">加载中…</p>
    </div>

    <div class="card" style="margin-top:16px;">
      <h2>近 30 天复习量</h2>
      <div class="chart" id="chart"></div>
      <p class="small muted" id="chart-hint" style="margin-bottom:0;"></p>
    </div>
  </main>

  <script type="module" src="/js/stats.js"></script>
</body>
</html>
